# harnessator source manifest - POINTER form (source format v1.1):
# [discover] registers every skills/<dir> containing SKILL.md live at
# load time - nothing is copied here, so this file cannot drift from
# the tree below. Pinned upstream provenance: see UPSTREAM.md; the
# authors' license travels verbatim in LICENSE.
kind = "source"
schema = 2

[package]
  name = "copilot-skills"
  description = "github/awesome-copilot skills (MIT) - a pinned harnessator harvest of the skills/ collection, upstream LICENSE carried; prefer the stack profiles below over :default."
  license = "MIT"
  homepage = "https://github.com/github/awesome-copilot"

[discover]
  skill = "skills/*"

[profiles]
  [profiles."quality-security"]
    skill = ["agent-owasp-compliance", "agentic-eval", "ai-prompt-engineering-safety-review", "api-breaking-change-detector", "apple-appstore-reviewer", "arch-linux-triage", "arize-evaluator", "audit-integrity", "aws-well-architected-review", "azure-well-architected-review", "bigquery-pipeline-audit", "breakdown-epic-arch", "breakdown-epic-pm", "breakdown-feature-implementation"]
  [profiles."agent-dev"]
    skill = ["agent-architecture", "agent-governance", "agent-owasp-compliance", "agent-skill-stack", "agent-supply-chain", "agentic-eval", "ai-prompt-engineering-safety-review", "ai-team-orchestration", "arize-ai-provider-integration", "arize-annotation", "arize-dataset", "arize-evaluator", "arize-experiment", "arize-instrumentation"]
  [profiles."azure-dotnet"]
    skill = ["acreadiness-assess", "acreadiness-generate-instructions", "acreadiness-policy", "agent-owasp-compliance", "appinsights-instrumentation", "arduino-azure-iot-edge-integration", "aspire", "aspnet-minimal-api-openapi", "azure-architecture-autopilot", "azure-container-registry-cli", "azure-deployment-preflight", "azure-developer-cli", "azure-devops-cli", "azure-logic-apps-standard-cli"]
  [profiles."python-stack"]
    skill = ["aws-cdk-python-setup", "dataverse-python-advanced-patterns", "dataverse-python-production-code", "dataverse-python-quickstart", "dataverse-python-usecase-builder", "pytest-coverage", "python-azure-iot-edge-modules", "python-mcp-server-generator", "python-pypi-package-builder"]
  [profiles."web-frontend"]
    skill = ["acquire-codebase-knowledge", "anti-ui-slop", "arduino-azure-iot-edge-integration", "azure-smart-city-iot-solution-builder", "build-evidence-map", "copilot-cli-quickstart", "create-github-issues-for-unmet-specification-requirements", "dataverse-python-quickstart", "dataverse-python-usecase-builder", "dotnet-mcp-builder", "flowstudio-power-automate-build", "fluentui-blazor", "from-the-other-side-quinn", "gem-devops-guidelines"]
  [profiles."default"]
    skill = ["*"]
